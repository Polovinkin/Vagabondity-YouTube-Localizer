[project]
name = "vagabondity-youtube-localizer"
version = "0.2.0"
description = "Translate and publish YouTube metadata with a clean, intuitive interface — free by default, easy to set up, and designed to run locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepl>=1.22,<2",
    "flask>=3.1,<4",
    "google-api-python-client>=2.180,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-cloud-translate>=3.21,<4",
]

[project.scripts]
vagabondity-youtube-localizer = "vagabondity_youtube_localizer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vagabondity_youtube_localizer"]
